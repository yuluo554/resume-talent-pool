name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          # 依赖纪律：测试期真实 import 生成器（reportlab/python-docx）、抽取校验
          # （pdfplumber）与 GUI 真实窗口测试（PySide6）→ 显式安装四组 extras，
          # 禁止测试靠 importorskip 静默少跑（对照收集数，M5 起含 gui）
          pip install -e ".[dev,parse,gen,gui]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen   # 无显示环境跑 GUI 真实窗口测试（test_gui 内亦兜底设置）
        run: pytest
