name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          # 依赖纪律：测试期真实 import 生成器（reportlab/python-docx）与抽取校验
          # （pdfplumber）→ dev 之外显式安装 gen+parse，禁止测试靠 importorskip 静默跳过
          pip install -e ".[dev,parse,gen]"
      - name: Test
        run: pytest
